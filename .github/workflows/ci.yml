# Lean engine CI — compile + run the unit test suite (includes the segment
# fail-closed table-id gate and the .wseg format invariants). Typical run is a
# minute or two: no QUIC. The MsQuic CMake build adds several minutes and is
# Linux/-Dquic-only, so it is deliberately excluded from the fast path here.
name: CI

on:
  push:
    branches: [main, master, "feat/**", "fix/**", "refactor/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Engine (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: false # skip the heavy QUIC submodules (msquic / libwtf)

      - name: Fetch the meshguard submodule only
        run: git submodule update --init --depth 1 deps/meshguard

      # Linux links the vendored deps/lib/libsodium.so; the system package resolves
      # the same soname at test-runtime. (~seconds, mirrors the Docker build recipe.)
      - name: Install libsodium
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsodium-dev

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - name: zig build test
        run: zig build test

      - name: Build the standalone server and tools
        run: zig build -Doptimize=ReleaseSmall

  client:
    name: Bun client
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/bun
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun test
