name: Deploy teaser site to Pages

on:
  push:
    branches: [main]
    paths:
      - 'landing/**'
      - '.github/workflows/deploy.yml'
  # Allow running manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

# WormDB is private and not open-source at launch. GitHub Pages serves ONLY the
# static teaser in landing/ — the docs/ VitePress site is intentionally NOT built
# or published here, so internal documentation never leaves the repo.
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload teaser artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: landing

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
