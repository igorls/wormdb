<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WormChat — Real-Time Chat on WormDB</title>
  <meta name="description" content="Real-time chat application powered by WormDB browser-direct. No backend required.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-root: #0a0b10;
      --bg-sidebar: rgba(12, 14, 24, 0.95);
      --bg-main: rgba(14, 16, 28, 0.6);
      --bg-input: rgba(8, 10, 18, 0.95);
      --bg-message: rgba(20, 24, 42, 0.6);
      --bg-own: rgba(0, 212, 170, 0.08);
      --bg-system: rgba(255, 255, 255, 0.02);
      --border: rgba(50, 60, 95, 0.25);
      --border-active: rgba(0, 212, 170, 0.4);
      --text: #e4e8f2;
      --text-secondary: #7e889e;
      --text-dim: #454d65;
      --accent: #00d4aa;
      --accent-soft: rgba(0, 212, 170, 0.12);
      --danger: #ff4466;
      --blue: #44aaff;
      --purple: #aa77ff;
      --amber: #ffaa22;
      --font: 'Inter', -apple-system, sans-serif;
      --mono: 'JetBrains Mono', monospace;
      --radius: 12px;
      --ease: 200ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg-root);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 40% at 20% 0%, rgba(0,212,170,0.04) 0%, transparent 60%),
        radial-gradient(ellipse 50% 50% at 85% 100%, rgba(170,119,255,0.03) 0%, transparent 50%);
      pointer-events: none;
    }

    /* ── Layout ─────────────────────────────────────────────────── */
    .app {
      display: flex;
      height: 100vh;
    }

    /* ── Sidebar ────────────────────────────────────────────────── */
    .sidebar {
      width: 260px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      backdrop-filter: blur(20px);
    }

    .sidebar-header {
      padding: 1.1rem 1.2rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }

    .logo {
      width: 32px; height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), #0088aa);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 14px; color: #fff;
      box-shadow: 0 0 16px rgba(0,212,170,0.2);
    }

    .sidebar-header h1 {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .sidebar-header h1 span { color: var(--accent); }

    .app-badge {
      font-size: 0.6rem;
      background: var(--accent-soft);
      color: var(--accent);
      padding: 0.15rem 0.45rem;
      border-radius: 3px;
      font-weight: 600;
      letter-spacing: 0.04em;
      margin-left: auto;
    }

    /* ── Connection Status ───────────────────────────────────────── */
    .conn-status {
      padding: 0.7rem 1.2rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.72rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text-secondary);
    }

    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--text-dim);
      transition: all var(--ease);
      flex-shrink: 0;
    }

    .dot.on {
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent);
    }

    .dot.connecting {
      background: var(--amber);
      animation: blink 1s infinite;
    }

    @keyframes blink { 50% { opacity: 0.3; } }

    .conn-latency {
      margin-left: auto;
      font-family: var(--mono);
      font-size: 0.68rem;
      color: var(--accent);
      opacity: 0;
      transition: opacity var(--ease);
    }

    .conn-latency.visible { opacity: 1; }

    /* ── Room List ───────────────────────────────────────────────── */
    .room-section-title {
      padding: 0.75rem 1.2rem 0.4rem;
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-dim);
    }

    .room-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.2rem 0.5rem;
    }

    .room-item {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.55rem 0.75rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      color: var(--text-secondary);
      transition: all var(--ease);
      margin-bottom: 2px;
    }

    .room-item:hover { background: rgba(255,255,255,0.03); color: var(--text); }

    .room-item.active {
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
    }

    .room-item .hash {
      font-family: var(--mono);
      font-size: 1rem;
      opacity: 0.4;
    }

    .room-item.active .hash { opacity: 0.8; }

    .room-item .unread {
      margin-left: auto;
      min-width: 18px;
      height: 18px;
      border-radius: 9px;
      background: var(--accent);
      color: #060a0d;
      font-size: 0.65rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 5px;
    }

    /* ── New Room ────────────────────────────────────────────────── */
    .new-room {
      padding: 0.6rem 0.8rem;
      border-top: 1px solid var(--border);
    }

    .new-room input {
      width: 100%;
      font-family: var(--font);
      font-size: 0.8rem;
      background: var(--bg-input);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.5rem 0.7rem;
      outline: none;
      transition: border-color var(--ease);
    }

    .new-room input:focus {
      border-color: var(--border-active);
      box-shadow: 0 0 0 2px var(--accent-soft);
    }

    .new-room input::placeholder { color: var(--text-dim); }

    /* ── User Footer ────────────────────────────────────────────── */
    .user-footer {
      padding: 0.75rem 1.2rem;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .avatar {
      width: 30px; height: 30px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.75rem; font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }

    .user-name {
      font-size: 0.82rem;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── Main Chat Area ─────────────────────────────────────────── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    /* ── Chat Header ────────────────────────────────────────────── */
    .chat-header {
      padding: 0.85rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: var(--bg-main);
      backdrop-filter: blur(16px);
    }

    .chat-header .room-name {
      font-size: 1rem;
      font-weight: 700;
    }

    .chat-header .room-name .hash {
      color: var(--text-dim);
      font-family: var(--mono);
      margin-right: 2px;
    }

    .member-count {
      margin-left: auto;
      font-size: 0.72rem;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .powered-by {
      font-size: 0.65rem;
      color: var(--text-dim);
      font-family: var(--mono);
      background: rgba(255,255,255,0.02);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      border: 1px solid var(--border);
    }

    /* ── Messages ────────────────────────────────────────────────── */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      scroll-behavior: smooth;
    }

    .msg {
      display: flex;
      gap: 0.7rem;
      padding: 0.5rem 0.7rem;
      border-radius: 8px;
      transition: background var(--ease);
      animation: msgIn 0.25s ease;
    }

    .msg:hover { background: rgba(255,255,255,0.015); }

    .msg.own { background: var(--bg-own); }

    .msg.system {
      justify-content: center;
      gap: 0;
      padding: 0.3rem;
    }

    .msg.system .msg-body {
      font-size: 0.72rem;
      color: var(--text-dim);
      font-style: italic;
    }

    @keyframes msgIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-avatar { flex-shrink: 0; margin-top: 2px; }

    .msg-content { flex: 1; min-width: 0; }

    .msg-meta {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
      margin-bottom: 0.15rem;
    }

    .msg-author {
      font-size: 0.82rem;
      font-weight: 600;
    }

    .msg-time {
      font-size: 0.68rem;
      color: var(--text-dim);
      font-family: var(--mono);
    }

    .msg-body {
      font-size: 0.88rem;
      line-height: 1.5;
      color: var(--text);
      word-wrap: break-word;
    }

    .msg-body code {
      font-family: var(--mono);
      font-size: 0.82rem;
      background: rgba(255,255,255,0.06);
      padding: 0.1rem 0.35rem;
      border-radius: 3px;
    }

    /* ── Typing indicator ────────────────────────────────────────── */
    .typing-bar {
      padding: 0.3rem 1.5rem;
      font-size: 0.7rem;
      color: var(--text-dim);
      min-height: 22px;
      font-style: italic;
    }

    /* ── Compose ─────────────────────────────────────────────────── */
    .compose {
      padding: 0.75rem 1.5rem 1rem;
      border-top: 1px solid var(--border);
      background: var(--bg-main);
      backdrop-filter: blur(16px);
    }

    .compose-inner {
      display: flex;
      gap: 0.6rem;
      align-items: center;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.15rem 0.15rem 0.15rem 1rem;
      transition: border-color var(--ease);
    }

    .compose-inner:focus-within {
      border-color: var(--border-active);
      box-shadow: 0 0 0 2px var(--accent-soft);
    }

    .compose-inner input {
      flex: 1;
      font-family: var(--font);
      font-size: 0.88rem;
      background: transparent;
      color: var(--text);
      border: none;
      outline: none;
      padding: 0.5rem 0;
    }

    .compose-inner input::placeholder { color: var(--text-dim); }

    .send-btn {
      width: 36px; height: 36px;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: #060a0d;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      transition: all var(--ease);
      flex-shrink: 0;
    }

    .send-btn:hover {
      background: #00f0c0;
      transform: scale(1.05);
    }

    .send-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      transform: none;
    }

    /* ── Welcome / Login Overlay ─────────────────────────────────── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(6, 8, 14, 0.92);
      backdrop-filter: blur(24px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .login-card {
      background: var(--bg-sidebar);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem;
      width: 380px;
      max-width: 90vw;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0,0,0,0.5);
    }

    .login-card .logo {
      width: 52px; height: 52px;
      font-size: 22px;
      margin: 0 auto 1.2rem;
      border-radius: 14px;
    }

    .login-card h2 {
      font-size: 1.3rem;
      margin-bottom: 0.4rem;
      letter-spacing: -0.01em;
    }

    .login-card h2 span { color: var(--accent); }

    .login-card p {
      font-size: 0.82rem;
      color: var(--text-secondary);
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }

    .login-card input {
      width: 100%;
      font-family: var(--font);
      font-size: 0.95rem;
      background: var(--bg-input);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.75rem 1rem;
      outline: none;
      margin-bottom: 1rem;
      text-align: center;
      transition: border-color var(--ease);
    }

    .login-card input:focus {
      border-color: var(--border-active);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .login-card .join-btn {
      width: 100%;
      font-family: var(--font);
      font-size: 0.95rem;
      font-weight: 600;
      padding: 0.75rem;
      background: var(--accent);
      color: #060a0d;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all var(--ease);
    }

    .login-card .join-btn:hover {
      background: #00f0c0;
      box-shadow: 0 0 20px rgba(0,212,170,0.3);
      transform: translateY(-1px);
    }

    .login-card .join-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .login-card .footnote {
      margin-top: 1.2rem;
      font-size: 0.68rem;
      color: var(--text-dim);
    }

    .login-card .footnote code {
      font-family: var(--mono);
      background: rgba(255,255,255,0.04);
      padding: 0.1rem 0.3rem;
      border-radius: 3px;
    }

    /* ── Scrollbar ──────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--text-dim); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }

    @media (max-width: 640px) {
      .sidebar { width: 200px; }
      .messages { padding: 0.5rem; }
      .compose { padding: 0.5rem; }
      .members-panel { display: none; }
    }

    /* ── Members Panel ──────────────────────────────────────────── */
    .members-panel {
      width: 200px;
      background: var(--sidebar-bg);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .members-title {
      padding: 0.8rem 1rem 0.4rem;
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-dim);
    }

    .member-item {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.35rem 1rem;
      font-size: 0.82rem;
      color: var(--text-secondary);
      transition: background var(--ease);
    }

    .member-item:hover { background: rgba(255,255,255,0.02); }

    .member-item .avatar {
      width: 26px;
      height: 26px;
      font-size: 0.6rem;
      flex-shrink: 0;
      position: relative;
    }

    .member-item .online-dot {
      position: absolute;
      bottom: -1px;
      right: -1px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00d4aa;
      border: 2px solid var(--sidebar-bg);
    }

    .member-item .member-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .member-count-badge {
      font-size: 0.72rem;
      color: var(--text-dim);
      background: rgba(255,255,255,0.05);
      padding: 0.15rem 0.5rem;
      border-radius: 10px;
      margin-left: 0.5rem;
    }
  </style>
</head>
<body>

  <!-- Login Overlay -->
  <div class="overlay" id="loginOverlay">
    <div class="login-card">
      <div class="logo">W</div>
      <h2>Worm<span>Chat</span></h2>
      <p>Real-time chat powered by WormDB.<br>Secured with Ed25519 capability tokens.</p>
      <input type="text" id="loginName" placeholder="Enter your name" maxlength="20" autofocus spellcheck="false">
      <input type="text" id="loginUrl" placeholder="ws://localhost:6390" value="ws://localhost:6390" spellcheck="false"
        style="font-family: var(--mono); font-size: 0.82rem;">
      <input type="text" id="loginAuthUrl" placeholder="http://localhost:8081" value="http://localhost:8081" spellcheck="false"
        style="font-family: var(--mono); font-size: 0.82rem;">
      <button class="join-btn" id="loginBtn">Join Chat</button>
      <div class="footnote">Powered by <code>wormdb-web</code> · SCT auth · Ed25519 signed tokens</div>
    </div>
  </div>

  <!-- App Shell -->
  <div class="app" id="appShell" style="display: none;">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo">W</div>
        <h1>Worm<span>Chat</span></h1>
        <span class="app-badge">LIVE</span>
      </div>

      <div class="conn-status">
        <div class="dot" id="dot"></div>
        <span id="connLabel">Connecting…</span>
        <span class="conn-latency" id="latencyLabel"></span>
      </div>

      <div class="room-section-title">Channels</div>
      <div class="room-list" id="roomList"></div>

      <div class="new-room">
        <input type="text" id="newRoomInput" placeholder="+ New channel" spellcheck="false" maxlength="30">
      </div>

      <div class="user-footer">
        <div class="avatar" id="myAvatar"></div>
        <span class="user-name" id="myName"></span>
      </div>
    </aside>

    <!-- Main -->
    <main class="main">
      <div class="chat-header">
        <div class="room-name">
          <span class="hash">#</span><span id="currentRoomName">general</span>
          <span class="member-count-badge" id="memberCount">0 online</span>
        </div>
        <div class="member-count">
          <span class="powered-by">browser-direct · WormDB</span>
        </div>
      </div>

      <div class="messages" id="messages"></div>

      <div class="typing-bar" id="typingBar"></div>

      <div class="compose">
        <div class="compose-inner">
          <input type="text" id="msgInput" placeholder="Type a message…" maxlength="2000" spellcheck="false">
          <button class="send-btn" id="sendBtn" disabled title="Send">↑</button>
        </div>
      </div>
    </main>

    <!-- Members Panel -->
    <aside class="members-panel" id="membersPanel">
      <div class="members-title">Online — <span id="memberCountPanel">0</span></div>
      <div id="memberList"></div>
    </aside>

  </div>

  <script type="module">
    import { WormDB } from '../dist/index.js';

    // ── State ───────────────────────────────────────────────────
    let db = null;
    let username = '';
    let userColor = '';
    let currentRoom = 'general';
    let authUrl = '';
    let authToken = null; // hex string
    const rooms = new Map();
    const messageCache = new Map();
    const COLORS = ['#00d4aa','#44aaff','#aa77ff','#ff6688','#ffaa22','#66dd55','#ff77aa','#77ddff','#ddaa44','#44ddaa'];
    const DEFAULT_ROOMS = ['general', 'random', 'dev'];

    // ── DOM ──────────────────────────────────────────────────────
    const $ = id => document.getElementById(id);
    const loginOverlay = $('loginOverlay');
    const appShell = $('appShell');
    const loginName = $('loginName');
    const loginUrl = $('loginUrl');
    const loginAuthUrl = $('loginAuthUrl');
    const loginBtn = $('loginBtn');
    const dot = $('dot');
    const connLabel = $('connLabel');
    const latencyLabel = $('latencyLabel');
    const roomList = $('roomList');
    const newRoomInput = $('newRoomInput');
    const messagesEl = $('messages');
    const currentRoomName = $('currentRoomName');
    const msgInput = $('msgInput');
    const sendBtn = $('sendBtn');
    const typingBar = $('typingBar');
    const myAvatar = $('myAvatar');
    const myName = $('myName');
    const memberCount = $('memberCount');
    const memberCountPanel = $('memberCountPanel');
    const memberList = $('memberList');

    // ── Helpers ──────────────────────────────────────────────────
    function pickColor(name) {
      let hash = 0;
      for (let i = 0; i < name.length; i++) hash = ((hash << 5) - hash) + name.charCodeAt(i);
      return COLORS[Math.abs(hash) % COLORS.length];
    }

    function initials(name) {
      return name.slice(0, 2).toUpperCase();
    }

    function timeStr(ts) {
      const d = ts ? new Date(ts) : new Date();
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function formatBody(text) {
      // Simple inline code
      return escHtml(text).replace(/`([^`]+)`/g, '<code>$1</code>');
    }

    // ── Room Management ─────────────────────────────────────────
    function addRoom(name) {
      if (rooms.has(name)) return;
      rooms.set(name, { unread: 0, subscribed: false });
      if (!messageCache.has(name)) messageCache.set(name, []);
      renderRooms();
    }

    function renderRooms() {
      roomList.innerHTML = '';
      for (const [name, state] of rooms) {
        const el = document.createElement('div');
        el.className = 'room-item' + (name === currentRoom ? ' active' : '');
        el.innerHTML = `<span class="hash">#</span>${escHtml(name)}${state.unread > 0 ? `<span class="unread">${state.unread}</span>` : ''}`;
        el.addEventListener('click', () => switchRoom(name));
        roomList.appendChild(el);
      }
    }

    async function switchRoom(name) {
      currentRoom = name;
      currentRoomName.textContent = name;

      // Reset unread
      const state = rooms.get(name);
      if (state) { state.unread = 0; }

      // Subscribe if not yet
      if (state && !state.subscribed) {
        await subscribeRoom(name);
        state.subscribed = true;
      }

      // Load history from server
      await loadHistory(name);

      renderRooms();
      renderMessages();
      renderMembers();
      sendPresence('heartbeat');
      msgInput.focus();
    }

    async function subscribeRoom(name) {
      const channel = `chat:${name}`;
      try {
        await db.subscribe(channel, (_ch, data) => {
          try {
            const msg = JSON.parse(data);
            addMessage(name, msg);
          } catch { /* ignore malformed */ }
        });
      } catch (err) {
        console.error('Subscribe failed:', err);
      }
    }

    // ── Load History from Server ─────────────────────────────────
    async function loadHistory(room) {
      try {
        console.log('[loadHistory] loading room:', room);
        const resp = await db.exec('chat_history', room, '50');
        console.log('[loadHistory] resp:', resp);
        if (!resp || resp.type !== 'value' || !resp.data) {
          console.log('[loadHistory] no valid response, type:', resp?.type);
          return;
        }
        const messages = JSON.parse(resp.data);
        console.log('[loadHistory] parsed messages:', messages.length);
        const arr = messageCache.get(room) || [];
        // Merge: only add messages we don't already have (by ts)
        const existingTs = new Set(arr.map(m => m.ts));
        for (const msg of messages) {
          if (!existingTs.has(msg.ts)) {
            arr.push(msg);
          }
        }
        // Sort by timestamp
        arr.sort((a, b) => a.ts - b.ts);
        messageCache.set(room, arr);
      } catch (err) {
        console.error('Failed to load history:', err);
      }
    }

    // ── Messages ────────────────────────────────────────────────
    function addMessage(room, msg) {
      const arr = messageCache.get(room) || [];
      arr.push(msg);
      // Keep last 500
      if (arr.length > 500) arr.shift();
      messageCache.set(room, arr);

      if (room === currentRoom) {
        appendMessageEl(msg);
      } else {
        // Increment unread
        const state = rooms.get(room);
        if (state) {
          state.unread++;
          renderRooms();
        }
      }
    }

    function renderMessages() {
      messagesEl.innerHTML = '';
      const arr = messageCache.get(currentRoom) || [];
      for (const msg of arr) appendMessageEl(msg, false);
      scrollToBottom();
    }

    function appendMessageEl(msg, scroll = true) {
      const el = document.createElement('div');
      const isOwn = msg.user === username;
      const isSystem = msg.type === 'system';

      if (isSystem) {
        el.className = 'msg system';
        el.innerHTML = `<div class="msg-body">${escHtml(msg.text)}</div>`;
      } else {
        const color = pickColor(msg.user);
        el.className = 'msg' + (isOwn ? ' own' : '');
        el.innerHTML = `
          <div class="msg-avatar">
            <div class="avatar" style="background: ${color}">${initials(msg.user)}</div>
          </div>
          <div class="msg-content">
            <div class="msg-meta">
              <span class="msg-author" style="color: ${color}">${escHtml(msg.user)}</span>
              <span class="msg-time">${msg.time || timeStr(msg.ts)}</span>
            </div>
            <div class="msg-body">${formatBody(msg.text)}</div>
          </div>`;
      }

      messagesEl.appendChild(el);
      if (scroll) scrollToBottom();
    }

    function scrollToBottom() {
      requestAnimationFrame(() => {
        messagesEl.scrollTop = messagesEl.scrollHeight;
      });
    }

    // ── Send Message ────────────────────────────────────────────
    async function sendMessage() {
      const text = msgInput.value.trim();
      if (!text || !db) return;

      msgInput.value = '';
      sendBtn.disabled = true;

      try {
        // When authenticated: 2 args (username from token)
        // When unauthenticated: 3 args (username from client)
        if (authToken) {
          await db.exec('chat_send', currentRoom, text);
        } else {
          await db.exec('chat_send', currentRoom, username, text);
        }

        // Build local msg for instant display + PubSub broadcast
        const msg = { user: username, text, ts: Date.now() };
        await db.publish(`chat:${currentRoom}`, JSON.stringify(msg));
      } catch (err) {
        console.error('Send failed:', err);
      }
    }

    // ── Presence System ─────────────────────────────────────────
    const presenceMap = new Map(); // room → Map(username → { lastSeen, color })
    let heartbeatTimer = null;
    const HEARTBEAT_INTERVAL = 10000; // 10s
    const PRESENCE_TIMEOUT = 30000; // 30s

    function getPresence(room) {
      if (!presenceMap.has(room)) presenceMap.set(room, new Map());
      return presenceMap.get(room);
    }

    async function subscribePresence(room) {
      const channel = `presence:${room}`;
      try {
        await db.subscribe(channel, (_ch, data) => {
          try {
            const evt = JSON.parse(data);
            const presence = getPresence(room);
            if (evt.type === 'leave') {
              presence.delete(evt.user);
            } else {
              presence.set(evt.user, {
                lastSeen: Date.now(),
                color: pickColor(evt.user),
              });
            }
            if (room === currentRoom) renderMembers();
          } catch {}
        });
      } catch {}
    }

    function sendPresence(type) {
      if (!db || !currentRoom) return;
      const msg = JSON.stringify({ type, user: username, ts: Date.now() });
      db.publish(`presence:${currentRoom}`, msg).catch(() => {});
    }

    function startHeartbeat() {
      if (heartbeatTimer) clearInterval(heartbeatTimer);
      sendPresence('join');
      heartbeatTimer = setInterval(() => {
        sendPresence('heartbeat');
        pruneStaleUsers();
      }, HEARTBEAT_INTERVAL);
    }

    function pruneStaleUsers() {
      const now = Date.now();
      for (const [room, users] of presenceMap) {
        for (const [user, info] of users) {
          if (now - info.lastSeen > PRESENCE_TIMEOUT) {
            users.delete(user);
          }
        }
      }
      renderMembers();
    }

    function renderMembers() {
      const presence = getPresence(currentRoom);
      // Always include self
      presence.set(username, { lastSeen: Date.now(), color: userColor });

      const sorted = [...presence.entries()].sort((a, b) => {
        if (a[0] === username) return -1;
        if (b[0] === username) return 1;
        return a[0].localeCompare(b[0]);
      });

      const count = sorted.length;
      memberCount.textContent = `${count} online`;
      memberCountPanel.textContent = count;

      memberList.innerHTML = sorted.map(([name, info]) => `
        <div class="member-item">
          <div class="avatar" style="background: ${info.color}">
            ${initials(name)}
            <div class="online-dot"></div>
          </div>
          <span class="member-name">${escHtml(name)}${name === username ? ' (you)' : ''}</span>
        </div>
      `).join('');
    }

    // ── Announce join ────────────────────────────────────────────
    async function announceJoin(room) {
      const msg = { type: 'system', text: `${username} joined #${room}`, time: timeStr(), ts: Date.now() };
      try {
        await db.publish(`chat:${room}`, JSON.stringify(msg));
      } catch { /* best effort */ }
    }

    // ── Status Polling ──────────────────────────────────────────
    async function pollLatency() {
      if (!db || db.state !== 'connected') return;
      try {
        const start = performance.now();
        await db.status();
        const ms = Math.round(performance.now() - start);
        latencyLabel.textContent = `${ms}ms`;
        latencyLabel.classList.add('visible');
      } catch { /* ignore */ }
    }

    // ── Login Flow ──────────────────────────────────────────────
    loginBtn.addEventListener('click', () => startApp());
    loginName.addEventListener('keydown', e => {
      if (e.key === 'Enter') startApp();
    });

    async function startApp(savedName, savedUrl, savedAuthUrl) {
      const name = savedName || loginName.value.trim();
      const url = savedUrl || loginUrl.value.trim();
      const aUrl = savedAuthUrl || loginAuthUrl.value.trim();
      if (!name || !url) return;

      loginBtn.disabled = true;
      loginBtn.textContent = 'Authenticating…';

      username = name;
      userColor = pickColor(username);
      authUrl = aUrl;

      // Fetch SCT token from auth provider
      let tokenHex = null;
      if (aUrl) {
        try {
          const resp = await fetch(`${aUrl}/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: name }),
          });
          const data = await resp.json();
          if (data.token) {
            tokenHex = data.token;
            authToken = tokenHex;
            console.log(`[auth] Token received for "${name}" (expires in ${data.expiresIn}s)`);
          }
        } catch (err) {
          console.warn('[auth] Auth provider unavailable, connecting without auth:', err.message);
        }
      }

      loginBtn.textContent = 'Connecting…';

      try {
        const opts = { url, autoReconnect: true, timeoutMs: 5000 };
        if (tokenHex) {
          // Convert hex token to Uint8Array for tokenProvider
          const tokenBytes = new Uint8Array(tokenHex.match(/.{2}/g).map(b => parseInt(b, 16)));
          opts.tokenProvider = () => tokenBytes;
        }
        db = new WormDB(opts);
        await db.connect();
      } catch (err) {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Join Chat';
        console.error('[auth] Connection failed:', err.message || err);
        if (!savedName) alert(`Connection failed: ${err.message}`);
        return;
      }

      // Persist session for F5
      sessionStorage.setItem('wormchat_user', name);
      sessionStorage.setItem('wormchat_url', url);
      sessionStorage.setItem('wormchat_auth_url', aUrl);
      if (tokenHex) sessionStorage.setItem('wormchat_token', tokenHex);

      // Setup UI
      myAvatar.style.background = userColor;
      myAvatar.textContent = initials(username);
      myName.textContent = username;

      dot.classList.add('on');
      connLabel.textContent = 'Connected';

      // Initialize rooms
      for (const r of DEFAULT_ROOMS) addRoom(r);

      // Subscribe to all default rooms + presence
      for (const r of DEFAULT_ROOMS) {
        await subscribeRoom(r);
        await subscribePresence(r);
        rooms.get(r).subscribed = true;
      }

      // Switch to general (this loads history)
      await switchRoom('general');

      // Announce join + start presence heartbeat
      await announceJoin('general');
      startHeartbeat();

      // Start latency polling
      pollLatency();
      setInterval(pollLatency, 5000);

      // Show app
      loginOverlay.style.display = 'none';
      appShell.style.display = 'flex';
      msgInput.focus();
    }

    // ── Auto-reconnect on F5 ────────────────────────────────────
    {
      const saved = sessionStorage.getItem('wormchat_user');
      const savedUrl = sessionStorage.getItem('wormchat_url');
      const savedAuthUrl = sessionStorage.getItem('wormchat_auth_url');
      // Guard against stale/corrupt entries
      if (saved && savedUrl && !saved.startsWith('[object')) {
        startApp(saved, savedUrl, savedAuthUrl || '');
      } else if (saved?.startsWith('[object')) {
        sessionStorage.clear(); // Clean up corrupt session
      }
    }

    // ── Compose ─────────────────────────────────────────────────
    msgInput.addEventListener('input', () => {
      sendBtn.disabled = msgInput.value.trim().length === 0;
    });

    msgInput.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    sendBtn.addEventListener('click', sendMessage);

    // ── New Room ────────────────────────────────────────────────
    newRoomInput.addEventListener('keydown', async e => {
      if (e.key !== 'Enter') return;
      const name = newRoomInput.value.trim().toLowerCase().replace(/[^a-z0-9-_]/g, '');
      if (!name) return;

      addRoom(name);
      newRoomInput.value = '';
      await subscribePresence(name);
      await switchRoom(name);
      sendPresence('join');
      await announceJoin(name);
    });

    // Send leave on page close
    window.addEventListener('beforeunload', () => {
      sendPresence('leave');
    });
  </script>
</body>
</html>
